[package]
name = "dwt-rs"
description = "Rust port of the DWT-Drizzle partition-weighted stacking core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dwt-rs"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
bytemuck = { version = "1.19", features = ["derive"] }
flate2 = "1.0"

[features]
default = []
gpu = []

[lints]
workspace = true
