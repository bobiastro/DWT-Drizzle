[package]
name = "dwt-backend"
description = "Rust backend algorithms for DWT-Drizzle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "dwt_backend"
path = "src/lib.rs"

[[bin]]
name = "dwt-backend"
path = "src/bin/dwt-backend.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
