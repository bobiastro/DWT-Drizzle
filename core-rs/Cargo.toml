[workspace]
members = ["crates/dwt-backend", "crates/dwt-rs", "crates/dwt-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Single codegen unit + fat LTO: this is a numeric kernel bound by inner-loop
# throughput, so cross-crate inlining of the image/stack/drizzle helpers matters
# more than build time.  ~2x faster release builds of the hot loops at the cost
# of a slower link.
[profile.release]
lto = "fat"
codegen-units = 1
